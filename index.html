<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Digital - Boteco & Petiscaria</title>
  
  <!-- CSS Externo -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Tailwind CSS CDN com paleta personalizada em Azul -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6', // Azul Elétrico Principal
              600: '#2563eb', // Azul Hover
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased pb-28 selection:bg-brand-500 selection:text-white">

  <!-- CABEÇALHO DO ESTABELECIMENTO -->
  <header class="relative bg-zinc-900 border-b border-zinc-800 overflow-hidden">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:16px_16px]"></div>
    
    <div class="max-w-md mx-auto px-4 pt-6 pb-5 relative z-10">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3.5">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-blue-700 flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-brand-500/20 ring-2 ring-brand-500/30">
            <i class="fa-solid fa-beer-mug-empty"></i>
          </div>
          <div>
            <h1 class="text-xl font-extrabold text-white tracking-tight leading-tight">Boteco & Petiscaria</h1>
            <p class="text-xs text-zinc-400 mt-0.5 flex items-center gap-1.5">
              <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Aberto agora • Mesa <span id="display-mesa" class="font-bold text-brand-500">--</span>
            </p>
          </div>
        </div>

        <button onclick="alterarMesa()" class="px-3 py-1.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-800 border border-zinc-700/60 text-xs font-semibold text-zinc-300 transition flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square text-brand-500"></i>
          Mesa
        </button>
      </div>

      <!-- Barra de Busca -->
      <div class="mt-4 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar petiscos, cervejas, drinks..." 
          class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition shadow-inner"
        >
      </div>
    </div>
  </header>

  <!-- NAVEGAÇÃO DE CATEGORIAS -->
  <nav class="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80">
    <div class="max-w-md mx-auto px-4 flex gap-2 overflow-x-auto py-3 no-scrollbar" id="categories-container">
      <!-- As categorias são injetadas dinamicamente via JS -->
    </div>
  </nav>

  <!-- LISTA DE PRODUTOS -->
  <main class="max-w-md mx-auto px-4 mt-6">
    <section id="menu-container" class="space-y-4">
      <!-- Os itens do cardápio são injetados dinamicamente via JS -->
    </section>
  </main>

  <!-- BARRA FIXA DO CARRINHO (RODAPÉ) -->
  <div class="fixed bottom-0 left-0 right-0 z-40 bg-zinc-950/95 border-t border-zinc-800 backdrop-blur-lg p-4">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div class="flex flex-col">
        <span class="text-xs text-zinc-400 font-medium">Total do Pedido</span>
        <span id="cart-total-bar" class="text-xl font-black text-brand-500">R$ 0,00</span>
      </div>

      <button 
        onclick="abrirModalCarrinho()" 
        class="flex-1 bg-gradient-to-r from-brand-500 to-blue-600 hover:from-brand-600 hover:to-blue-700 active:scale-[0.98] text-white font-bold py-3 px-5 rounded-xl shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2.5 transition"
      >
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Ver Comanda</span>
        <span id="cart-count-badge" class="bg-black/30 text-white text-xs px-2 py-0.5 rounded-full font-bold min-w-[20px] text-center">0</span>
      </button>
    </div>
  </div>

  <!-- MODAL DO CARRINHO / COMANDA -->
  <div id="cart-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-zinc-900 border-t border-zinc-800 w-full max-w-md rounded-t-3xl max-h-[90vh] flex flex-col shadow-2xl transform translate-y-full transition-transform duration-300" id="cart-modal-content">
      
      <!-- Modal Header -->
      <div class="p-5 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <i class="fa-solid fa-receipt text-brand-500 text-lg"></i>
          <h2 class="text-lg font-bold text-white">Sua Comanda</h2>
        </div>
        <button onclick="fecharModalCarrinho()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Lista de Itens no Carrinho -->
      <div class="p-5 overflow-y-auto space-y-3 flex-1" id="cart-items-list">
        <!-- Injetado via JS -->
      </div>

      <!-- Modal Footer / Checkout -->
      <div class="p-5 border-t border-zinc-800 bg-zinc-950/60 space-y-4">
        <!-- Observação -->
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">Observação para a Cozinha/Bar</label>
          <input 
            type="text" 
            id="cart-obs" 
            placeholder="Ex: Ponto da carne bem passado, sem cebola..." 
            class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-brand-500"
          >
        </div>

        <!-- Resumo financeiro -->
        <div class="space-y-1.5 text-xs text-zinc-400 border-t border-zinc-800/80 pt-3">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span id="cart-subtotal" class="text-zinc-200 font-medium">R$ 0,00</span>
          </div>
          <div class="flex justify-between">
            <span>Taxa de Serviço (10% opcional)</span>
            <span id="cart-taxa" class="text-zinc-200 font-medium">R$ 0,00</span>
          </div>
          <div class="flex justify-between text-sm font-extrabold text-white pt-2 border-t border-zinc-800">
            <span>Total final</span>
            <span id="cart-total-modal" class="text-brand-500">R$ 0,00</span>
          </div>
        </div>

        <!-- Botão de Enviar Pedido -->
        <button 
          onclick="enviarPedidoWhatsApp()" 
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2.5 text-sm transition"
        >
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>Enviar Pedido para o Garçom</span>
        </button>
      </div>

    </div>
  </div>

  <!-- JavaScript do Projeto -->
  <script src="script.js"></script>
</body>
</html>
